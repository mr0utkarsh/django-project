<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SimpleSite{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #263238; background: #f5f7fa; font: 16px Arial, sans-serif; }
        header { background: white; border-bottom: 1px solid #e5e9ef; }
        nav { max-width: 960px; margin: auto; padding: 18px 22px; display: flex; gap: 20px; align-items: center; }
        nav a { color: #263238; text-decoration: none; }
        nav a:first-child { margin-right: auto; font-size: 20px; font-weight: bold; color: #1769aa; }
        nav form { margin: 0; }
        nav button { border: 0; background: none; color: #263238; font-size: 16px; cursor: pointer; }
        main { max-width: 760px; margin: 56px auto; padding: 0 22px; }
        .card { padding: 32px; background: white; border: 1px solid #e5e9ef; border-radius: 12px; }
        h1 { margin-top: 0; }
        p { line-height: 1.6; color: #58656f; }
        .button { display: inline-block; padding: 12px 18px; border: 0; border-radius: 6px; background: #1769aa; color: white; text-decoration: none; cursor: pointer; }
        .button.secondary { margin-left: 8px; background: #e8f1f8; color: #1769aa; }
        label { display: block; margin: 16px 0 6px; font-weight: bold; }
        input, textarea { width: 100%; padding: 11px; border: 1px solid #cbd3da; border-radius: 5px; font: inherit; }
        ul.errorlist { color: #b42318; }
        .messages { padding: 12px 16px; border-radius: 6px; background: #e8f6ec; color: #216e39; }
        .helptext { display: block; margin-top: 5px; color: #697780; font-size: 13px; }
        @media (max-width: 560px) { nav { gap: 12px; flex-wrap: wrap; } main { margin-top: 28px; } .card { padding: 24px; } }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home' %}">SimpleSite</a>
            <a href="{% url 'enquiry' %}">Enquiry</a>
            {% if user.is_authenticated %}
                <span>Hi, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Logout</button></form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}<div class="messages">{{ message }}</div>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
