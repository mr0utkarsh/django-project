{% extends "pages/base.html" %}
{% block title %}Login | SimpleSite{% endblock %}
{% block content %}
<section class="card">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a>.</p>
</section>
{% endblock %}
