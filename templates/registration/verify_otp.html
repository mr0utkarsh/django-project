{% extends "pages/base.html" %}
{% block title %}Verify email | SimpleSite{% endblock %}
{% block content %}
<section class="card">
    <h1>Verify your email</h1>
    <p>Enter the 6-digit code sent to <strong>{{ email }}</strong>. The code expires in 10 minutes.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Verify code</button>
    </form>
</section>
{% endblock %}
